<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile — ED-Tech Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter var', 'system-ui', 'sans-serif'] },
                    colors: {
                        primary: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 900: '#0c4a6e' },
                        surface: { 50: '#fafafa', 100: '#f5f5f5', 200: '#e5e5e5', 300: '#d4d4d4' }
                    },
                    animation: { 'fade-in': 'fadeIn 0.3s ease-out', 'slide-up': 'slideUp 0.4s ease-out' },
                    keyframes: {
                        fadeIn: { '0%': { opacity: 0 }, '100%': { opacity: 1 } },
                        slideUp: { '0%': { opacity: 0, transform: 'translateY(12px)' }, '100%': { opacity: 1, transform: 'translateY(0)' } }
                    }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter var', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 50%, #e2e8f0 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04), 0 2px 8px rgba(0, 0, 0, 0.03);
        }
        .input-premium {
            transition: all 0.2s ease;
            border-width: 1.5px;
        }
        .input-premium:focus {
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.12);
            border-color: #0ea5e9;
            outline: none;
        }
        .btn-premium {
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 14px rgba(14, 165, 233, 0.35);
        }
        .btn-premium:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(14, 165, 233, 0.45);
        }
        .btn-premium:active { transform: translateY(0); }
        .nav-link {
            position: relative;
            transition: color 0.2s ease;
        }
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #0ea5e9, #0284c7);
            transition: width 0.25s ease;
            border-radius: 2px;
        }
        .nav-link:hover::after,
        .nav-link.active::after { width: 100%; }
        .bookmark-card {
            transition: all 0.25s ease;
            border-left: 3px solid transparent;
        }
        .bookmark-card:hover {
            transform: translateX(4px);
            border-left-color: #0ea5e9;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }
        .message-success {
            background: linear-gradient(135deg, #ecfdf5, #f0fdf4);
            border: 1px solid #bbf7d0;
            color: #166534;
        }
        .message-error {
            background: linear-gradient(135deg, #fef2f2, #fff1f2);
            border: 1px solid #fecaca;
            color: #991b1b;
        }
        @media (prefers-reduced-motion: no-preference) {
            .animate-on-load { animation: slide-up 0.4s ease-out both; }
            .animate-on-load-delay { animation: slide-up 0.4s 0.1s ease-out both; opacity: 0; animation-fill-mode: forwards; }
        }
    </style>
</head>
<body class="text-gray-800">
    <!-- Premium Navigation -->
    <nav class="sticky top-0 z-50 glass-card border-b border-gray-200/60">
        <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2 group">
                <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-primary-500 to-primary-700 flex items-center justify-center shadow-lg shadow-primary-500/25">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                    </svg>
                </div>
                <span class="text-lg font-bold bg-gradient-to-r from-gray-900 to-gray-700 bg-clip-text text-transparent">ED-Tech</span>
            </a>
            <div class="flex gap-1 text-sm items-center">
                <a href="/" class="nav-link px-3 py-2 text-gray-600 hover:text-gray-900 font-medium">Courses</a>
                <a href="/profile.html" class="nav-link active px-3 py-2 text-gray-900 font-semibold">Profile</a>
                <button id="logoutBtn" class="hidden ml-2 px-4 py-2 text-sm font-medium text-red-600 hover:text-red-700 hover:bg-red-50 rounded-lg transition flex items-center gap-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                    </svg>
                    Logout
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-2xl mx-auto px-6 py-10">
        <!-- Auth Section -->
        <div id="authSection" class="animate-on-load">
            <div class="glass-card rounded-2xl p-8 md:p-10">
                <div class="text-center mb-8">
                    <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-primary-500 to-primary-600 mb-4 shadow-lg shadow-primary-500/30">
                        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                        </svg>
                    </div>
                    <h2 id="authTitle" class="text-2xl md:text-3xl font-bold text-gray-900">Welcome back</h2>
                    <p class="text-gray-500 mt-2">Sign in to access your learning dashboard</p>
                </div>
                
                <div id="msg" class="hidden p-4 rounded-xl mb-6 text-sm font-medium animate-fade-in"></div>
                
                <form id="authForm" class="space-y-5">
                    <div class="space-y-1.5">
                        <label for="email" class="block text-sm font-semibold text-gray-700 ml-1">Email address</label>
                        <input type="email" id="email" required 
                            class="input-premium w-full px-4 py-3.5 bg-white border border-gray-200 rounded-xl focus:border-primary-500 text-gray-900 placeholder-gray-400"
                            placeholder="you@example.com">
                    </div>
                    <div class="space-y-1.5">
                        <label for="password" class="block text-sm font-semibold text-gray-700 ml-1 flex items-center justify-between">
                            <span>Password</span>
                            <a href="#" class="text-xs font-medium text-primary-600 hover:text-primary-700 transition">Forgot?</a>
                        </label>
                        <input type="password" id="password" required minlength="6" 
                            class="input-premium w-full px-4 py-3.5 bg-white border border-gray-200 rounded-xl focus:border-primary-500 text-gray-900 placeholder-gray-400"
                            placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn-premium w-full text-white py-3.5 rounded-xl font-semibold text-base mt-2">
                        Sign in to continue
                    </button>
                </form>
                
                <div class="relative my-7">
                    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-200"></div></div>
                    <div class="relative flex justify-center text-xs"><span class="px-3 bg-white text-gray-500">or continue with</span></div>
                </div>
                
                <div class="grid grid-cols-2 gap-3">
                    <button class="flex items-center justify-center gap-2 px-4 py-3 border border-gray-200 rounded-xl hover:border-gray-300 hover:bg-gray-50 transition font-medium text-sm">
                        <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                        Google
                    </button>
                    <button class="flex items-center justify-center gap-2 px-4 py-3 border border-gray-200 rounded-xl hover:border-gray-300 hover:bg-gray-50 transition font-medium text-sm">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                        GitHub
                    </button>
                </div>
                
                <p class="text-center mt-8 text-sm text-gray-600">
                    <span id="toggleText">New to ED-Tech?</span>
                    <button onclick="toggleAuth()" class="font-semibold text-primary-600 hover:text-primary-700 underline decoration-primary-300 underline-offset-2 transition ml-1">Create account</button>
                </p>
            </div>
        </div>

        <!-- Profile Section -->
        <div id="profileSection" class="hidden">
            <div class="flex items-center gap-4 mb-8 animate-on-load">
                <div class="relative">
                    <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-primary-500 to-primary-600 flex items-center justify-center shadow-lg shadow-primary-500/30">
                        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                        </svg>
                    </div>
                    <span class="absolute -bottom-1 -right-1 w-5 h-5 bg-green-500 border-2 border-white rounded-full"></span>
                </div>
                <div>
                    <h1 class="text-3xl font-bold text-gray-900">Your Bookmarks</h1>
                    <p class="text-gray-500 mt-0.5">Saved courses and resources</p>
                </div>
            </div>
            
            <div id="bookmarksList" class="space-y-3 animate-on-load-delay">
                <div class="glass-card rounded-xl p-5 text-center text-gray-400 py-12">
                    <svg class="w-12 h-12 mx-auto mb-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
                    </svg>
                    <p class="font-medium">No bookmarks yet</p>
                    <p class="text-sm mt-1">Save courses to access them quickly here</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Premium Footer -->
    <footer class="max-w-6xl mx-auto px-6 py-8 mt-12 border-t border-gray-200/60">
        <div class="flex flex-col md:flex-row items-center justify-between gap-4 text-sm text-gray-500">
            <p>© 2024 ED-Tech Premium. All rights reserved.</p>
            <div class="flex gap-5">
                <a href="#" class="hover:text-gray-700 transition">Privacy</a>
                <a href="#" class="hover:text-gray-700 transition">Terms</a>
                <a href="#" class="hover:text-gray-700 transition">Support</a>
            </div>
        </div>
    </footer>

    <script src="/profile.js"></script>
</body>
</html>
