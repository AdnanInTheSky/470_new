<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - ED-Tech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
    </style>
</head>
<body class="bg-white">
    <nav class="border-b border-gray-100">
        <div class="max-w-6xl mx-auto px-6 h-14 flex items-center justify-between">
            <a href="/" class="text-lg font-semibold text-gray-900">ED-Tech</a>
            <div class="flex gap-6 text-sm items-center">
                <a href="/" class="text-gray-500 hover:text-gray-900 transition">Courses</a>
                <a href="/profile.html" class="text-gray-900 font-medium">Profile</a>
                <button id="logoutBtn" class="hidden text-red-500 hover:text-red-600 transition">Logout</button>
            </div>
        </div>
    </nav>


    <main class="max-w-2xl mx-auto px-6 py-12">
        <div id="authSection">
            <div class="border border-gray-200 rounded-lg p-8">
                <h2 id="authTitle" class="text-2xl font-semibold text-gray-900 mb-6">Sign in</h2>
                <div id="msg" class="hidden p-3 rounded-lg mb-4 text-sm"></div>
                <form id="authForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                        <input type="email" id="email" required class="w-full px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:border-gray-400 transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                        <input type="password" id="password" required minlength="6" class="w-full px-3 py-2 border border-gray-200 rounded-lg focus:outline-none focus:border-gray-400 transition">
                    </div>
                    <button type="submit" class="w-full bg-gray-900 text-white py-2.5 rounded-lg hover:bg-gray-800 transition font-medium">Sign in</button>
                </form>
                <p class="text-center mt-4 text-sm text-gray-500">
                    <span id="toggleText">No account?</span>
                    <button onclick="toggleAuth()" class="text-gray-900 underline ml-1">Register</button>
                </p>
            </div>
        </div>


        <div id="profileSection" class="hidden">
            <h1 class="text-3xl font-bold text-gray-900 mb-8">Bookmarks</h1>
            <div id="bookmarksList"><p class="text-gray-400">No bookmarks yet.</p></div>
        </div>
    </main>


    <script src="/profile.js"></script>
</body>
</html>
