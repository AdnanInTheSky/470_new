<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - ED-Tech</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#2563eb',
            secondary: '#7c3aed',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50">
  <!-- Navbar -->
  <nav class="bg-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="/" class="text-2xl font-bold text-blue-600">📚 ED-Tech</a>
      <div class="flex gap-6 items-center">
        <a href="/" class="text-gray-600 hover:text-blue-600 font-semibold">Home</a>
        <a href="/profile.html" class="text-blue-600 font-semibold">Profile</a>
        <button id="logoutBtn" class="hidden bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition">Logout</button>
      </div>
    </div>
  </nav>

  <div class="max-w-7xl mx-auto px-4 py-12">
    <!-- Auth Form -->
    <div id="authSection" class="max-w-md mx-auto bg-white rounded-xl shadow-lg p-8">
      <h2 id="authTitle" class="text-3xl font-bold text-gray-900 mb-6">Login</h2>
      <div id="errorMsg" class="hidden bg-red-100 text-red-700 p-3 rounded-lg mb-4"></div>
      <div id="successMsg" class="hidden bg-green-100 text-green-700 p-3 rounded-lg mb-4"></div>
      
      <form id="authForm" class="space-y-4">
        <div>
          <label class="block text-gray-700 font-semibold mb-2">Email</label>
          <input type="email" id="email" required 
                 class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-blue-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-gray-700 font-semibold mb-2">Password</label>
          <input type="password" id="password" required minlength="6"
                 class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-blue-500 focus:outline-none">
        </div>
        <button type="submit" 
                class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition">
          Login
        </button>
      </form>
      
      <p class="text-center mt-4 text-gray-600">
        <span id="toggleText">Don't have an account?</span>
        <button onclick="toggleAuth()" class="text-blue-600 font-semibold hover:underline">Register</button>
      </p>
    </div>

    <!-- Profile Section -->
    <div id="profileSection" class="hidden">
      <div class="bg-white rounded-xl shadow-lg p-8 mb-8">
        <h1 class="text-3xl font-bold text-gray-900 mb-2">Welcome, <span id="userEmail"></span>!</h1>
        <p class="text-gray-600">Manage your bookmarked courses</p>
      </div>

      <!-- Search -->
      <div class="mb-8">
        <input type="text" id="profileSearch" placeholder="🔍 Search courses to bookmark..." 
               class="w-full px-6 py-4 text-lg border-2 border-gray-200 rounded-xl focus:border-blue-500 focus:outline-none">
      </div>

      <!-- Courses Grid -->
      <h2 class="text-2xl font-bold text-gray-900 mb-6">Available Courses</h2>
      <div id="profileCoursesGrid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6 mb-12"></div>

      <!-- Bookmarks -->
      <h2 class="text-2xl font-bold text-gray-900 mb-6">📌 My Bookmarks</h2>
      <div id="bookmarksList" class="space-y-4"></div>
    </div>
  </div>

  <script src="/profile.js"></script>
</body>
</html>
