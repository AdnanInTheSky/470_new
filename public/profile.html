<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - ED-Tech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            -webkit-font-smoothing: antialiased;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
        }
        .premium-card {
            background: #ffffff;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08), 
                        0 0 0 1px rgba(0, 0, 0, 0.05);
        }
        .input-premium {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            transition: all 0.2s ease;
        }
        .input-premium:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .btn-premium {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.25);
        }
        .btn-premium:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.35);
        }
        .btn-premium:active {
            transform: translateY(0);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-100 min-h-screen">
    <nav class="border-b border-gray-100 bg-white/80 backdrop-blur-sm sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 h-14 flex items-center justify-between">
            <a href="/" class="text-lg font-semibold text-gray-900">ED-Tech</a>
            <div class="flex gap-6 text-sm items-center">
                <a href="/" class="text-gray-500 hover:text-gray-900 transition">Courses</a>
                <a href="/profile.html" class="text-gray-900 font-medium">Profile</a>
                <button id="logoutBtn" class="hidden text-red-500 hover:text-red-600 transition">Logout</button>
            </div>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-6 py-12">
        <!-- Auth Section -->
        <div id="authSection">
            <div class="premium-card border border-gray-200 rounded-2xl p-8 max-w-md mx-auto">
                <h2 id="authTitle" class="text-2xl font-semibold text-gray-900 mb-6">Sign in</h2>
                <div id="msg" class="hidden p-3 rounded-lg mb-4 text-sm"></div>
                <form id="authForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                        <input type="email" id="email" required class="input-premium w-full px-4 py-3 rounded-lg outline-none text-slate-900 placeholder-slate-400">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                        <input type="password" id="password" required minlength="6" class="input-premium w-full px-4 py-3 rounded-lg outline-none text-slate-900 placeholder-slate-400">
                    </div>
                    <button type="submit" class="btn-premium w-full text-white py-3 rounded-lg font-medium">Sign in</button>
                </form>
                <p class="text-center mt-4 text-sm text-gray-500">
                    <span id="toggleText">No account?</span>
                    <button onclick="toggleAuth()" class="text-gray-900 underline ml-1 hover:text-blue-600 transition">Register</button>
                </p>
            </div>
        </div>

        <!-- Profile Section (shown when logged in) -->
        <div id="profileSection" class="hidden space-y-8">
                        <!-- Bookmarks Section -->
                         
            <div class="premium-card rounded-2xl p-8">
                <h1 class="text-2xl font-bold text-gray-900 mb-6">🔖 Your Bookmarks</h1>
                <div id="bookmarksList">
                    <p class="text-gray-400 text-center py-4">No bookmarks yet.</p>
                </div>
            </div>
            
            <!-- Resource Submission Form -->
            <div class="premium-card rounded-2xl p-8">
                <div class="mb-6 border-b border-slate-200 pb-4">
                    <h2 class="text-xl font-semibold text-slate-900">
                        📚 Share a Resource
                    </h2>
                    <p class="text-slate-500 text-sm mt-1">Contribute learning materials to help others</p>
                </div>

                <form id="resourceForm" class="space-y-5">
                    <div>
                        <label for="name" class="block text-sm font-medium text-slate-700 mb-1.5">Name</label>
                        <input
                            id="name"
                            type="text"
                            placeholder="Your full name"
                            required
                            class="input-premium w-full px-4 py-3 rounded-lg outline-none text-slate-900 placeholder-slate-400"
                        />
                    </div>

                    <div>
                        <label for="course" class="block text-sm font-medium text-slate-700 mb-1.5">Course</label>
                        <input
                            id="course"
                            type="text"
                            placeholder="e.g., Advanced Web Development"
                            required
                            class="input-premium w-full px-4 py-3 rounded-lg outline-none text-slate-900 placeholder-slate-400"
                        />
                    </div>

                    <div>
                        <label for="drive" class="block text-sm font-medium text-slate-700 mb-1.5">Google Drive Link</label>
                        <input
                            id="drive"
                            type="url"
                            placeholder="https://drive.google.com/..."
                            required
                            class="input-premium w-full px-4 py-3 rounded-lg outline-none text-slate-900 placeholder-slate-400"
                        />
                    </div>

                    <div>
                        <label for="youtube" class="block text-sm font-medium text-slate-700 mb-1.5">YouTube Link <span class="text-slate-400 font-normal">(optional)</span></label>
                        <input
                            id="youtube"
                            type="url"
                            placeholder="https://youtube.com/..."
                            class="input-premium w-full px-4 py-3 rounded-lg outline-none text-slate-900 placeholder-slate-400"
                        />
                    </div>

                    <div>
                        <label for="comment" class="block text-sm font-medium text-slate-700 mb-1.5">Comment <span class="text-slate-400 font-normal">(optional)</span></label>
                        <textarea
                            id="comment"
                            placeholder="Additional notes or description..."
                            rows="4"
                            class="input-premium w-full px-4 py-3 rounded-lg outline-none text-slate-900 placeholder-slate-400 resize-none"
                        ></textarea>
                    </div>

                    <button
                        type="submit"
                        class="btn-premium w-full text-white font-medium py-3 px-4 rounded-lg"
                    >
                        Submit Resource
                    </button>
                </form>
                <p id="resourceMsg" class="mt-4 text-sm text-center min-h-[1.25rem]"></p>
            </div>

            <!-- Bookmarks Section -->
            <div class="premium-card rounded-2xl p-8">
                <h1 class="text-2xl font-bold text-gray-900 mb-6">🔖 Your Bookmarks</h1>
                <div id="bookmarksList">
                    <p class="text-gray-400 text-center py-4">No bookmarks yet.</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        // === Auth Logic ===
        let token = localStorage.getItem('token');
        let isLogin = true;

        function check() {
            if (token) {
                document.getElementById('authSection').classList.add('hidden');
                document.getElementById('profileSection').classList.remove('hidden');
                document.getElementById('logoutBtn').classList.remove('hidden');
                loadBookmarks();
            } else {
                document.getElementById('authSection').classList.remove('hidden');
                document.getElementById('profileSection').classList.add('hidden');
                document.getElementById('logoutBtn').classList.add('hidden');
            }
        }

        function toggleAuth() {
            isLogin = !isLogin;
            document.getElementById('authTitle').textContent = isLogin ? 'Sign in' : 'Register';
            document.querySelector('#authForm button').textContent = isLogin ? 'Sign in' : 'Register';
            document.getElementById('toggleText').textContent = isLogin ? 'No account?' : 'Have an account?';
        }

        function showMsg(text, type, elementId = 'msg') {
            const el = document.getElementById(elementId);
            el.textContent = text;
            el.className = `p-3 rounded-lg mb-4 text-sm ${type === 'error' ? 'bg-red-50 text-red-600' : 'bg-green-50 text-green-600'} ${type === 'info' ? 'bg-slate-50 text-slate-600' : ''}`;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 3000);
        }

        // === Auth Form Submission ===
        document.getElementById('authForm').addEventListener('submit', async e => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const endpoint = isLogin ? '/api/login' : '/api/register';
            
            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    if (isLogin) {
                        token = data.token;
                        localStorage.setItem('token', token);
                        showMsg('Signed in successfully', 'success');
                        check();
                    } else {
                        showMsg('Registered! Please sign in.', 'success');
                        toggleAuth();
                        document.getElementById('password').value = '';
                    }
                } else {
                    showMsg(data.error || 'Error', 'error');
                }
            } catch (e) {
                showMsg('Network error', 'error');
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('token');
            token = null;
            check();
        });

        // === Load Bookmarks ===
        async function loadBookmarks() {
            try {
                const [cr, br] = await Promise.all([
                    fetch('/courses.json'),
                    fetch('/api/getBookmarks', { headers: { Authorization: `Bearer ${token}` } })
                ]);
                const courses = await cr.json();
                const { bookmarks } = await br.json();
                const list = document.getElementById('bookmarksList');
                if (!bookmarks || !bookmarks.length) {
                    list.innerHTML = '<p class="text-gray-400 text-center py-4">No bookmarks yet.</p>';
                    return;
                }
                list.innerHTML = bookmarks.map(slug => {
                    const c = courses.find(c => c.slug === slug);
                    return c ? `<a href="/courses/${c.slug}" class="block p-4 border border-gray-200 rounded-xl mb-3 hover:border-blue-300 hover:shadow-sm transition bg-white">
                        <h3 class="font-medium text-gray-900">${c.title}</h3>
                        <p class="text-sm text-gray-500 mt-1">${c.faculty}</p>
                    </a>` : '';
                }).join('');
            } catch (e) {
                console.error(e);
                document.getElementById('bookmarksList').innerHTML = '<p class="text-red-500 text-center">Failed to load bookmarks.</p>';
            }
        }

        // === Resource Submission Form ===
        const RESOURCE_ENDPOINT = "https://script.google.com/macros/s/AKfycbzoIa4owOnRP9AJrwiGTZQcDzbRUulyLxoZNqvsf7ZqtUMHdB48DibwuCObmTASFTym/exec";

        document.getElementById("resourceForm").addEventListener("submit", async function(e){
            e.preventDefault();

            const msg = document.getElementById("resourceMsg");
            msg.textContent = "Submitting...";
            msg.className = "mt-4 text-sm text-center text-slate-500 min-h-[1.25rem]";

            const data = {
                name: document.getElementById("name").value,
                course: document.getElementById("course").value,
                drive: document.getElementById("drive").value,
                youtube: document.getElementById("youtube").value,
                comment: document.getElementById("comment").value,
                submittedBy: localStorage.getItem('userEmail') || 'Anonymous'
            };

            try {
                const res = await fetch(RESOURCE_ENDPOINT, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify(data),
                    redirect: "follow"
                });

                const result = await res.json();

                if(result.status === "ok" || result.status === "success"){
                    msg.textContent = "✓ Resource submitted successfully!";
                    msg.className = "mt-4 text-sm text-center text-emerald-600 font-medium min-h-[1.25rem]";
                    document.getElementById("resourceForm").reset();
                    // Optional: auto-hide success message after 3 seconds
                    setTimeout(() => {
                        msg.classList.add('hidden');
                    }, 3000);
                } else {
                    msg.textContent = "Submission failed. Please try again.";
                    msg.className = "mt-4 text-sm text-center text-red-600 font-medium min-h-[1.25rem]";
                }
            } catch (err) {
                console.error(err);
                msg.textContent = "Error connecting to server.";
                msg.className = "mt-4 text-sm text-center text-red-600 font-medium min-h-[1.25rem]";
            }
        });

        // Initialize
        check();
    </script>
</body>
</html>
